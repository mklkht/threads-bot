name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ci-dummy-token
      LLM_PROVIDER: anthropic
      LLM_API_KEY: ci-dummy-key
      LLM_MODEL_POST: ci-dummy-model
      LLM_MODEL_CLASSIFY: ci-dummy-model
      ACCOUNT_PERSONA: ci persona
      NICHE_TOPICS: "topic-a;topic-b"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Compile check
        run: python -m compileall -q .

      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F .

      - name: Shell syntax check
        run: bash -n deploy.sh scripts/*.sh

      - name: Import check (module must not execute on import)
        run: python -c "import bot"

      - name: Validate compose file
        run: docker compose -f compose.yaml config -q

      - name: Run tests
        run: pytest -q
