services:
  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Europe/Kyiv
    command: sh -c "pip install -q -r requirements.txt && python bot.py"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/app/data/heartbeat')<1200 else 1)"]
      interval: 5m
      timeout: 10s
      start_period: 3m
    restart: unless-stopped
volumes:
  pip-cache:
